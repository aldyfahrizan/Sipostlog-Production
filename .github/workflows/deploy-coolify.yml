name: Deploy ke Coolify

# Setiap push/merge ke main memicu deploy ulang aplikasi di Coolify.
# Hanya butuh 1 repository secret (Settings > Secrets and variables > Actions):
#   COOLIFY_TOKEN     API token Coolify (Keys & Tokens > API tokens, izin "deploy")
# Alamat panel dan UUID aplikasi diatur di blok env di bawah; secret
# COOLIFY_URL / COOLIFY_APP_UUID (opsional) akan menimpanya bila diisi.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coolify-deploy
  cancel-in-progress: false

env:
  DEFAULT_COOLIFY_URL: http://103.127.96.32:8000
  DEFAULT_COOLIFY_APP_UUID: x43jcxgopn0ec7h5acs71bbw

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Periksa secret
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL || env.DEFAULT_COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID || env.DEFAULT_COOLIFY_APP_UUID }}
        run: |
          missing=""
          [ -z "$COOLIFY_URL" ] && missing="$missing COOLIFY_URL"
          [ -z "$COOLIFY_TOKEN" ] && missing="$missing COOLIFY_TOKEN"
          [ -z "$COOLIFY_APP_UUID" ] && missing="$missing COOLIFY_APP_UUID"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diisi:$missing"
            exit 1
          fi

      - name: Picu deploy di Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL || env.DEFAULT_COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID || env.DEFAULT_COOLIFY_APP_UUID }}
        run: |
          curl --fail-with-body -sS -m 60 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
