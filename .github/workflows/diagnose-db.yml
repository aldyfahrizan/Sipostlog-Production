name: Diagnosa Koneksi MongoDB

# Mengetuk port publik MongoDB tanpa password untuk melihat bagaimana koneksi BARU dijawab.
# Port diberikan saat menjalankan dan disamarkan di log.

on:
  workflow_dispatch:
    inputs:
      port:
        description: Port publik MongoDB
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pymongo==4.6.3
      - name: Periksa port MongoDB
        # Port dibaca dari berkas event, bukan lewat ekspresi: ekspresi yang sudah diisi
        # tercetak di kepala langkah sebelum masker aktif.
        run: |
          PORT=$(jq -r '.inputs.port // empty' "$GITHUB_EVENT_PATH")
          case "$PORT" in ''|*[!0-9]*) echo "::error::Port harus angka"; exit 1;; esac
          echo "::add-mask::$PORT"
          python .github/scripts/diagnose_mongo.py 103.127.96.32 "$PORT"
      - name: Pembanding - aplikasi yang sedang berjalan
        run: curl -sS -m 20 http://x43jcxgopn0ec7h5acs71bbw.103.127.96.32.sslip.io/api/health; echo
